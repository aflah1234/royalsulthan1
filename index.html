<body>

    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="ROYAL SULTHAN overview"><span class="brand-mark">RS</span><span><span class="brand-name">ROYAL SULTHAN</span><span class="brand-sub">FOODS · OWNER DESK</span></span></a>
      <div class="nav-label">Business</div>
      <nav class="nav" aria-label="Main navigation">
        <a class="nav-link" href="#overview" data-route="overview"><span class="nav-icon">⌂</span>Overview</a>
        <a class="nav-link" href="#customers" data-route="customers"><span class="nav-icon">♙</span>Customers</a>
        <a class="nav-link" href="#sales" data-route="sales"><span class="nav-icon">↗</span>Sales</a>
        <a class="nav-link" href="#expenses" data-route="expenses"><span class="nav-icon">↘</span>Expenses</a>
      </nav>
      <div class="sidebar-bottom"><strong>Monica Premium</strong>Tea Powder<br />Owner ledger · 2026</div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="crumb">ROYAL SULTHAN <span aria-hidden="true">/</span> <b id="route-label">Overview</b></div><div class="top-right"><span class="today" id="today"></span><span class="avatar" aria-label="Owner">RS</span></div></header>
      <div class="content">
        <section class="route-view" data-view="overview" id="overview-view"></section>
        <section class="route-view hidden" data-view="customers" id="customers-view"></section>
        <section class="route-view hidden" data-view="sales" id="sales-view"></section>
        <section class="route-view hidden" data-view="expenses" id="expenses-view"></section>
      </div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script>
    const STORE_KEY = 'royalSulthanLedgerV1';
    const currency = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
    const day = new Date();
    const isoDate = (date = new Date()) => {
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    };
    const seedData = {
      customers: [
        { id: 'c1', name: 'Green Valley Stores', phone: '98765 43210', location: 'Kochi', note: 'Prefers 1 kg packs. Call before Friday delivery.', created: '2026-09-22' },
        { id: 'c2', name: 'Nila Tea Corner', phone: '98470 21846', location: 'Thrissur', note: 'Regular weekly order; ask for proprietor Anil.', created: '2026-09-18' },
        { id: 'c3', name: 'The Morning Cup', phone: '98950 66132', location: 'Calicut', note: 'Interested in a trial carton of Monica Premium.', created: '2026-09-12' },
        { id: 'c4', name: 'Malabar Mini Mart', phone: '94472 35790', location: 'Kannur', note: 'Invoice to purchasing desk. Payment by bank transfer.', created: '2026-09-07' }
      ],
      sales: [
        { id: 's1', customerId: 'c1', date: '2026-09-29', product: 'Monica Premium Tea Powder · 1 kg', quantity: 12, amount: 8400, payment: 'Paid' },
        { id: 's2', customerId: 'c2', date: '2026-09-28', product: 'Monica Premium Tea Powder · 500 g', quantity: 18, amount: 8100, payment: 'Paid' },
        { id: 's3', customerId: 'c3', date: '2026-09-27', product: 'Monica Premium Tea Powder · 1 kg', quantity: 6, amount: 4200, payment: 'Pending' },
        { id: 's4', customerId: 'c4', date: '2026-09-25', product: 'Monica Premium Tea Powder · 250 g', quantity: 24, amount: 6000, payment: 'Paid' },
        { id: 's5', customerId: 'c1', date: '2026-09-19', product: 'Monica Premium Tea Powder · 500 g', quantity: 10, amount: 4500, payment: 'Paid' }
      ],
      expenses: [
        { id: 'e1', date: '2026-09-29', category: 'Packaging', description: 'Printed Monica pouches', amount: 3200 },
        { id: 'e2', date: '2026-09-27', category: 'Delivery', description: 'Local wholesale deliveries', amount: 1450 },
        { id: 'e3', date: '2026-09-24', category: 'Stock purchase', description: 'Tea leaves · September lot', amount: 8700 },
        { id: 'e4', date: '2026-09-20', category: 'Utilities', description: 'Packing unit electricity', amount: 980 }
      ]
    };
    let data;
    try { data = JSON.parse(localStorage.getItem(STORE_KEY)) || seedData; } catch { data = seedData; }
    const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(data));
    const escapeHtml = (value = '') => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const money = value => currency.format(Number(value) || 0);
    const niceDate = value => new Date(`${value}T00:00:00`).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    const customerName = id => data.customers.find(customer => customer.id === id)?.name || 'Walk-in customer';
    const monthSales = () => data.sales.filter(sale => sale.date.slice(0, 7) === isoDate().slice(0, 7));
    const monthExpenses = () => data.expenses.filter(expense => expense.date.slice(0, 7) === isoDate().slice(0, 7));
    const sum = entries => entries.reduce((total, item) => total + Number(item.amount || 0), 0);
    const initials = name => name.split(/\s+/).slice(0, 2).map(part => part[0] || '').join('').toUpperCase();
    document.getElementById('today').textContent = day.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

    function renderOverview() {
      const sales = monthSales();
      const expenses = monthExpenses();
      const salesTotal = sum(sales);
      const expenseTotal = sum(expenses);
      const pending = sales.filter(sale => sale.payment === 'Pending');
      const recent = [...data.sales].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4);
      const months = Array.from({ length: 6 }, (_, index) => {
        const date = new Date(day.getFullYear(), day.getMonth() - (5 - index), 1);
        const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        return { label: date.toLocaleDateString('en', { month: 'short' }), amount: sum(data.sales.filter(sale => sale.date.startsWith(key))) };
      });
      const max = Math.max(...months.map(item => item.amount), 1);
      document.getElementById('overview-view').innerHTML = `
        <div class="page-heading"><div><div class="eyebrow">Owner's desk · ${day.toLocaleDateString('en', { month: 'long', year: 'numeric' })}</div><h1>Good business starts here.</h1><p>Your Monica Premium ledger at a glance.</p></div><div class="actions"><button class="button secondary" data-action="add-customer">+ Customer note</button><button class="button" data-action="add-sale">+ Record sale</button></div></div>
        <div class="metrics">
          <div class="metric"><div class="metric-label">Sales this month</div><div class="metric-value">${money(salesTotal)}</div><div class="metric-note">${sales.length} recorded orders</div></div>
          <div class="metric"><div class="metric-label">Expenses this month</div><div class="metric-value">${money(expenseTotal)}</div><div class="metric-note">Across ${new Set(expenses.map(item => item.category)).size} expense categories</div></div>
          <div class="metric"><div class="metric-label">Net after expenses</div><div class="metric-value">${money(salesTotal - expenseTotal)}</div><div class="metric-note">Sales less recorded expenses</div></div>
          <div class="metric"><div class="metric-label">To collect</div><div class="metric-value">${money(sum(pending))}</div><div class="metric-note">${pending.length} unpaid ${pending.length === 1 ? 'invoice' : 'invoices'}</div></div>
        </div>
        <div class="overview-grid">
          <section class="panel"><div class="panel-head"><h2>Sales rhythm</h2><a href="#sales">All sales →</a></div><div class="panel-body"><div class="chart-meta"><span class="chart-total">${money(salesTotal)}</span><span class="chart-caption">Monthly sales · last 6 months</span></div><div class="chart" aria-label="Sales chart for the last six months">${months.map((item, index) => `<div class="bar-group"><div class="bar ${index === months.length - 1 ? 'current' : ''}" style="--height:${Math.max(item.amount / max * 100, 3)}%" title="${escapeHtml(item.label)}: ${money(item.amount)}"></div><span class="bar-label">${escapeHtml(item.label)}</span></div>`).join('')}</div></div></section>
          <section class="panel"><div class="panel-head"><h2>Monica, on the shelf</h2><span class="eyebrow" style="margin:0">Our label</span></div><div class="product-spotlight"><div class="product-copy"><div class="eyebrow">A ROYAL SULTHAN brand</div><h2>Monica Premium<br />Tea Powder</h2><p>Rich colour. Full-bodied taste.<br />Made for the everyday cup.</p></div><div class="tea-tin" aria-label="Illustration of a Monica tea tin"><div class="tin-label"><small>ROYAL SULTHAN</small>MONICA<br />PREMIUM TEA</div></div></div><div class="panel-body"><div class="mix-list"><div><div class="mix-row"><span class="mix-label"><i class="dot"></i>1 kg packs</span><span class="mix-value">${data.sales.filter(item => item.product.includes('1 kg')).reduce((n, item) => n + Number(item.quantity), 0)} sold</span></div><div class="mix-track"><div class="mix-fill" style="--width:64%"></div></div></div><div><div class="mix-row"><span class="mix-label"><i class="dot gold"></i>500 g packs</span><span class="mix-value">${data.sales.filter(item => item.product.includes('500 g')).reduce((n, item) => n + Number(item.quantity), 0)} sold</span></div><div class="mix-track"><div class="mix-fill gold" style="--width:43%"></div></div></div><div><div class="mix-row"><span class="mix-label"><i class="dot rose"></i>250 g packs</span><span class="mix-value">${data.sales.filter(item => item.product.includes('250 g')).reduce((n, item) => n + Number(item.quantity), 0)} sold</span></div><div class="mix-track"><div class="mix-fill rose" style="--width:28%"></div></div></div></div></div></section>
        </div>
        <div class="lower-grid"><section class="panel"><div class="panel-head"><h2>Latest sales</h2><a href="#sales">View ledger →</a></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Date</th><th>Amount</th><th>Payment</th></tr></thead><tbody>${recent.length ? recent.map(sale => `<tr><td data-label="Customer"><div class="customer-cell"><span class="mini-avatar">${escapeHtml(initials(customerName(sale.customerId)))}</span><span>${escapeHtml(customerName(sale.customerId))}</span></div></td><td class="muted" data-label="Date">${niceDate(sale.date)}</td><td class="amount" data-label="Amount">${money(sale.amount)}</td><td data-label="Payment"><span class="status ${sale.payment === 'Pending' ? 'pending' : ''}">${escapeHtml(sale.payment)}</span></td></tr>`).join('') : '<tr><td colspan="4" class="empty-state">No sales recorded yet.</td></tr>'}</tbody></table></div></section><section class="panel"><div class="panel-head"><h2>Owner's note</h2><a href="#customers">Customers →</a></div><div class="panel-body"><div class="quick-note"><strong>${escapeHtml(data.customers[0]?.name || 'Your customers')}</strong>${escapeHtml(data.customers[0]?.note || 'Add a customer note to keep important follow-ups close at hand.')}</div><div style="display:flex;justify-content:space-between;margin-top:17px;font-size:11px"><span class="muted">Customer book</span><strong>${data.customers.length} saved</strong></div><div style="display:flex;justify-content:space-between;margin-top:11px;font-size:11px"><span class="muted">Latest expense</span><strong>${data.expenses.length ? money([...data.expenses].sort((a,b) => b.date.localeCompare(a.date))[0].amount) : money(0)}</strong></div></div></section></div>`;
    }

    function renderCustomers(query = '') {
      const needle = query.toLowerCase();
      const customers = data.customers.filter(customer => [customer.name, customer.phone, customer.location, customer.note].join(' ').toLowerCase().includes(needle));
      document.getElementById('customers-view').innerHTML = `<div class="page-heading"><div><div class="eyebrow">Relationships are the real ledger</div><h1>Customer book</h1><p>People, places, and the details worth remembering.</p></div><div class="actions"><button class="button" data-action="add-customer">+ Add customer note</button></div></div><div class="toolbar"><label class="search"><span>⌕</span><input id="customer-search" type="search" placeholder="Find a customer or note" value="${escapeHtml(query)}" /></label><span class="count">${customers.length} of ${data.customers.length} customers</span></div><section class="table-panel"><div class="table-title"><h2>Customer notes</h2><span class="count">Saved on this device</span></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>Location</th><th>Owner's note</th><th>Added</th></tr></thead><tbody>${customers.length ? customers.map(customer => `<tr><td data-label="Customer"><div class="customer-cell"><span class="mini-avatar">${escapeHtml(initials(customer.name))}</span><strong>${escapeHtml(customer.name)}</strong></div></td><td data-label="Phone">${escapeHtml(customer.phone || '—')}</td><td data-label="Location">${escapeHtml(customer.location || '—')}</td><td class="note-cell" data-label="Owner's note" title="${escapeHtml(customer.note)}">${escapeHtml(customer.note || '—')}</td><td class="muted" data-label="Added">${niceDate(customer.created)}</td></tr>`).join('') : '<tr><td colspan="5" class="empty-state">No matching customers. Add one to your book.</td></tr>'}</tbody></table></div></section>`;
      document.getElementById('customer-search')?.addEventListener('input', event => {
        const query = event.target.value;
        const cursor = event.target.selectionStart;
        renderCustomers(query);
        const search = document.getElementById('customer-search');
        search.focus();
        search.setSelectionRange(cursor, cursor);
      });
    }

    function renderSales() {
      const list = [...data.sales].sort((a, b) => b.date.localeCompare(a.date));
      const current = monthSales();
      document.getElementById('sales-view').innerHTML = `<div class="page-heading"><div><div class="eyebrow">Monica Premium · order book</div><h1>Sales ledger</h1><p>Track orders and keep an eye on payments due.</p></div><div class="actions"><button class="button" data-action="add-sale">+ Record sale</button></div></div><div class="summary-strip"><div class="summary-item"><span>This month</span><strong>${money(sum(current))}</strong></div><i class="summary-divider"></i><div class="summary-item"><span>Orders</span><strong>${current.length}</strong></div><i class="summary-divider"></i><div class="summary-item"><span>Outstanding</span><strong>${money(sum(current.filter(item => item.payment === 'Pending')))}</strong></div></div><section class="table-panel"><div class="table-title"><h2>All sales</h2><span class="count">${list.length} ${list.length === 1 ? 'entry' : 'entries'}</span></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Product</th><th>Qty</th><th>Amount</th><th>Payment</th></tr></thead><tbody>${list.length ? list.map(sale => `<tr><td data-label="Date">${niceDate(sale.date)}</td><td data-label="Customer"><strong>${escapeHtml(customerName(sale.customerId))}</strong></td><td data-label="Product">${escapeHtml(sale.product)}</td><td data-label="Qty">${Number(sale.quantity)}</td><td class="amount" data-label="Amount">${money(sale.amount)}</td><td data-label="Payment"><span class="status ${sale.payment === 'Pending' ? 'pending' : ''}">${escapeHtml(sale.payment)}</span></td></tr>`).join('') : '<tr><td colspan="6" class="empty-state">No sales yet. Record the first Monica order.</td></tr>'}</tbody></table></div></section>`;
    }

    function renderExpenses() {
      const list = [...data.expenses].sort((a, b) => b.date.localeCompare(a.date));
      const current = monthExpenses();
      const categories = new Set(current.map(item => item.category));
      document.getElementById('expenses-view').innerHTML = `<div class="page-heading"><div><div class="eyebrow">Every rupee has a place</div><h1>Expense book</h1><p>Record the running costs behind every good cup.</p></div><div class="actions"><button class="button" data-action="add-expense">+ Add expense</button></div></div><div class="summary-strip"><div class="summary-item"><span>This month</span><strong>${money(sum(current))}</strong></div><i class="summary-divider"></i><div class="summary-item"><span>Entries</span><strong>${current.length}</strong></div><i class="summary-divider"></i><div class="summary-item"><span>Categories</span><strong>${categories.size}</strong></div></div><section class="table-panel"><div class="table-title"><h2>All expenses</h2><span class="count">${list.length} ${list.length === 1 ? 'entry' : 'entries'}</span></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead><tbody>${list.length ? list.map(item => `<tr><td data-label="Date">${niceDate(item.date)}</td><td data-label="Category"><span class="status">${escapeHtml(item.category)}</span></td><td data-label="Description">${escapeHtml(item.description)}</td><td class="amount" data-label="Amount">${money(item.amount)}</td></tr>`).join('') : '<tr><td colspan="4" class="empty-state">No expenses recorded yet.</td></tr>'}</tbody></table></div></section>`;
    }

    function render() {
      const route = location.hash.slice(1) || 'overview';
      const active = ['overview', 'customers', 'sales', 'expenses'].includes(route) ? route : 'overview';
      document.querySelectorAll('[data-view]').forEach(view => view.classList.toggle('hidden', view.dataset.view !== active));
      document.querySelectorAll('[data-route]').forEach(link => link.classList.toggle('active', link.dataset.route === active));
      document.getElementById('route-label').textContent = active[0].toUpperCase() + active.slice(1);
      if (active === 'overview') renderOverview();
      if (active === 'customers') renderCustomers(document.getElementById('customer-search')?.value || '');
      if (active === 'sales') renderSales();
      if (active === 'expenses') renderExpenses();
    }

    function openModal(type) {
      const forms = {
        customer: { title: 'Add customer note', fields: `<div class="field"><label for="name">Customer name *</label><input id="name" name="name" required placeholder="Shop or contact name" /></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" placeholder="Phone number" /></div><div class="field"><label for="location">Location</label><input id="location" name="location" placeholder="Town or area" /></div><div class="field full"><label for="note">Owner's note</label><textarea id="note" name="note" placeholder="Preferences, follow-up, delivery details..."></textarea></div>` },
        sale: { title: 'Record a sale', fields: `<div class="field"><label for="customerId">Customer *</label><select id="customerId" name="customerId" required>${data.customers.length ? data.customers.map(customer => `<option value="${escapeHtml(customer.id)}">${escapeHtml(customer.name)}</option>`).join('') : '<option value="">Add a customer first</option>'}</select></div><div class="field"><label for="date">Sale date *</label><input id="date" name="date" type="date" value="${isoDate()}" required /></div><div class="field full"><label for="product">Product *</label><select id="product" name="product"><option>Monica Premium Tea Powder · 250 g</option><option>Monica Premium Tea Powder · 500 g</option><option selected>Monica Premium Tea Powder · 1 kg</option></select></div><div class="field"><label for="quantity">Quantity *</label><input id="quantity" name="quantity" type="number" min="1" step="1" value="1" required /></div><div class="field"><label for="amount">Total amount (₹) *</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required /></div><div class="field full"><label for="payment">Payment status</label><select id="payment" name="payment"><option>Paid</option><option>Pending</option></select></div>` },
        expense: { title: 'Add an expense', fields: `<div class="field"><label for="date">Date *</label><input id="date" name="date" type="date" value="${isoDate()}" required /></div><div class="field"><label for="category">Category *</label><select id="category" name="category"><option>Stock purchase</option><option>Packaging</option><option>Delivery</option><option>Utilities</option><option>Wages</option><option>Marketing</option><option>Other</option></select></div><div class="field full"><label for="description">Description *</label><input id="description" name="description" placeholder="What was this expense for?" required /></div><div class="field"><label for="amount">Amount (₹) *</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required /></div>` }
      }[type];
      document.getElementById('modal-root').innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><h2 id="modal-title">${forms.title}</h2><button class="close-button" type="button" aria-label="Close" data-close-modal>×</button></header><form class="modal-form" id="entry-form"><div class="form-grid">${forms.fields}</div><div class="form-actions"><button type="button" class="button secondary" data-close-modal>Cancel</button><button class="button" type="submit">Save ${type === 'customer' ? 'customer' : type}</button></div></form></section></div>`;
      document.querySelector('#entry-form input, #entry-form select')?.focus();
      document.getElementById('entry-form').addEventListener('submit', event => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(event.currentTarget));
        if (type === 'customer') data.customers.unshift({ ...values, id: `c${Date.now()}`, created: isoDate() });
        if (type === 'sale') {
          if (!values.customerId) return;
          data.sales.unshift({ ...values, id: `s${Date.now()}`, quantity: Number(values.quantity), amount: Number(values.amount) });
        }
        if (type === 'expense') data.expenses.unshift({ ...values, id: `e${Date.now()}`, amount: Number(values.amount) });
        save();
        document.getElementById('modal-root').innerHTML = '';
        render();
        showToast(type === 'customer' ? 'Customer note saved' : type === 'sale' ? 'Sale recorded' : 'Expense saved');
      });
    }
    function showToast(message) {
      const root = document.getElementById('toast-root');
      root.innerHTML = `<div class="toast">${escapeHtml(message)}</div>`;
      setTimeout(() => { root.innerHTML = ''; }, 2600);
    }
    document.addEventListener('click', event => {
      const action = event.target.closest('[data-action]')?.dataset.action;
      if (action) openModal(action.replace('add-', ''));
      if (event.target.matches('[data-close-modal]')) document.getElementById('modal-root').innerHTML = '';
    });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') document.getElementById('modal-root').innerHTML = ''; });
    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
